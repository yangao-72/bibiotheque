<div class="ds-card reservation-form anim-rise">
  <div class="ds-card__body">
    <div class="ds-split">

      <!-- Colonne formulaire -->
      <div>
        <h3 class="reservation-form__title">
          <span class="reservation-form__icon" aria-hidden="true"><i class="fas fa-plus"></i></span>
          {{ 'reservations.createTitle' | translate }}
        </h3>

        <form (ngSubmit)="onSubmit()" autocomplete="off" novalidate>

          <!-- Livre -->
          <div class="ds-field">
            <label class="ds-label ds-label--required" for="livreId">
              {{ 'reservations.book' | translate }}
            </label>
            <select class="ds-select"
                    id="livreId"
                    [ngModel]="reservation.livreId"
                    (ngModelChange)="onLivreChange($event)"
                    name="livreId">
              <option [ngValue]="null" disabled>— {{ 'reservations.chooseBook' | translate }} —</option>
              <option *ngFor="let book of books" [ngValue]="book.bookId">
                {{ book.bookName }} — {{ book.bookAuthor }}
              </option>
            </select>
            <span class="ds-hint" *ngIf="books.length === 0">
              <i class="fas fa-triangle-exclamation" aria-hidden="true"></i>
              {{ 'reservations.noBookAvailable' | translate }}
            </span>
          </div>

          <!-- Adhérent — réservé au bibliothécaire (RS-04) -->
          <div class="ds-field" *ngIf="estBibliothecaire">
            <label class="ds-label ds-label--required" for="adherentId">
              {{ 'reservations.member' | translate }}
            </label>
            <select class="ds-select"
                    id="adherentId"
                    [ngModel]="reservation.adherentId"
                    (ngModelChange)="onAdherentChange($event)"
                    name="adherentId">
              <option [ngValue]="null" disabled>— {{ 'reservations.chooseMember' | translate }} —</option>
              <option *ngFor="let user of users" [ngValue]="user.userId">
                {{ user.name }} ({{ user.username }})
              </option>
            </select>
            <span class="ds-hint" *ngIf="users.length === 0">
              <i class="fas fa-triangle-exclamation" aria-hidden="true"></i>
              {{ 'reservations.noMemberAvailable' | translate }}
            </span>
          </div>

          <!-- Un adhérent réserve toujours pour lui-même : l'identité vient du token -->
          <div class="reservation-form__identity" *ngIf="!estBibliothecaire">
            <i class="fas fa-user-shield" aria-hidden="true"></i>
            <span>{{ 'reservations.forYourself' | translate }}</span>
          </div>

          <button type="submit"
                  class="ds-btn ds-btn--primary ds-btn--lg ds-btn--block"
                  [disabled]="!isFormValid">
            <i class="fas fa-calendar-plus" aria-hidden="true"></i>
            {{ 'reservations.submit' | translate }}
          </button>
        </form>
      </div>

      <!-- Colonne illustration -->
      <div class="ds-split__art">
        <app-illustration name="reserve"></app-illustration>
      </div>

    </div>
  </div>
</div>
