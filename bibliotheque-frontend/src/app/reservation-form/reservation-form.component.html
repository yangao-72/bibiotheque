<div class="reservation-form-wrapper">
  <div class="row justify-content-center">
    <div class="col-12 col-sm-10 col-md-8 col-lg-6">

      <!-- Titre -->
      <h3 class="form-title text-center mb-4">
        <span class="form-title-icon me-2"><i class="fas fa-plus-circle"></i></span>
        Créer une réservation
      </h3>

      <!-- Messages animés -->
      <div class="messages-container">
        <!-- Erreur -->
        <div *ngIf="formError" class="toast-message toast-error d-flex align-items-center justify-content-between">
          <div class="d-flex align-items-center">
            <span class="toast-icon me-2"><i class="fas fa-exclamation-circle"></i></span>
            <span><strong>Erreur :</strong> {{ formError }}</span>
          </div>
          <button class="btn-close btn-close-white" (click)="closeFormError()" aria-label="Fermer"></button>
        </div>

        <!-- Succès -->
        <div *ngIf="formSuccess" class="toast-message toast-success d-flex align-items-center justify-content-between">
          <div class="d-flex align-items-center">
            <span class="toast-icon me-2"><i class="fas fa-check-circle"></i></span>
            <span>{{ formSuccess }}</span>
          </div>
          <button class="btn-close btn-close-white" (click)="closeFormSuccess()" aria-label="Fermer"></button>
        </div>
      </div>

      <!-- Formulaire -->
      <div class="form-card">
        <form (ngSubmit)="onSubmit()" autocomplete="off">

          <!-- Sélecteur Livre -->
          <div class="mb-4">
            <label for="livreId" class="form-label fw-semibold">
              <span class="label-icon me-1"><i class="fas fa-book"></i></span> Livre
            </label>
            <select
              class="form-select form-select-lg"
              id="livreId"
              [ngModel]="reservation.livreId"
              (ngModelChange)="onLivreChange($event)"
              name="livreId">
              <option [ngValue]="null" disabled>-- Sélectionner un livre --</option>
              <option *ngFor="let book of books" [ngValue]="book.bookId">
                {{ book.bookName }} — {{ book.bookAuthor }}
              </option>
            </select>
            <div class="form-hint" *ngIf="books.length === 0">
              <span class="text-warning"><i class="fas fa-exclamation-triangle"></i></span> Aucun livre disponible.
            </div>
          </div>

          <!-- Sélecteur Adhérent -->
          <div class="mb-4">
            <label for="adherentId" class="form-label fw-semibold">
              <span class="label-icon me-1"><i class="fas fa-user"></i></span> Adhérent
            </label>
            <select
              class="form-select form-select-lg"
              id="adherentId"
              [ngModel]="reservation.adherentId"
              (ngModelChange)="onAdherentChange($event)"
              name="adherentId">
              <option [ngValue]="null" disabled>-- Sélectionner un adhérent --</option>
              <option *ngFor="let user of users" [ngValue]="user.userId">
                {{ user.name }} ({{ user.username }})
              </option>
            </select>
            <div class="form-hint" *ngIf="users.length === 0">
              <span class="text-warning"><i class="fas fa-exclamation-triangle"></i></span> Aucun adhérent disponible.
            </div>
          </div>

          <!-- Bouton -->
          <div class="d-grid">
            <button
              class="btn btn-lg btn-submit"
              type="submit"
              [disabled]="!isFormValid"
              [class.disabled]="!isFormValid">
              <i class="fas fa-calendar-plus me-2"></i> Créer la réservation
            </button>
          </div>

        </form>
      </div>

    </div>
  </div>
</div>
