<div class="create-book bg-grid">
  <div class="create-book__shell ds-split ds-split--form-right">

    <!-- Formulaire -->
    <div class="ds-card anim-rise">
      <div class="ds-card__body">
        <header class="ds-page-header">
          <div>
            <h1 class="ds-page-header__title">
              <span class="ds-page-header__icon" aria-hidden="true"><i class="fas fa-plus"></i></span>
              {{ 'books.addTitle' | translate }}
            </h1>
            <p class="ds-page-header__subtitle">{{ 'books.addSubtitle' | translate }}</p>
          </div>
        </header>

        <div *ngIf="successMessage" class="cb-alert cb-alert--success anim-rise-sm" role="status">
          <i class="fas fa-circle-check" aria-hidden="true"></i>
          <span>{{ successMessage | translate }}</span>
          <button type="button" class="cb-alert__close" (click)="successMessage = ''"
                  [attr.aria-label]="'common.close' | translate">
            <i class="fas fa-xmark" aria-hidden="true"></i>
          </button>
        </div>

        <div *ngIf="errorMessage" class="cb-alert cb-alert--error anim-rise-sm" role="alert">
          <i class="fas fa-circle-exclamation" aria-hidden="true"></i>
          <span>{{ errorMessage | translate }}</span>
          <button type="button" class="cb-alert__close" (click)="errorMessage = ''"
                  [attr.aria-label]="'common.close' | translate">
            <i class="fas fa-xmark" aria-hidden="true"></i>
          </button>
        </div>

        <form (ngSubmit)="onSubmit()" autocomplete="off" novalidate>

          <div class="ds-field">
            <label class="ds-label ds-label--required" for="bookName">{{ 'books.name' | translate }}</label>
            <div class="ds-input-group">
              <span class="ds-input-group__icon" aria-hidden="true"><i class="fas fa-book"></i></span>
              <input type="text" class="ds-input" id="bookName"
                     [(ngModel)]="book.bookName" name="bookName"
                     placeholder="Le Petit Prince">
            </div>
          </div>

          <div class="ds-field">
            <label class="ds-label ds-label--required" for="bookAuthor">{{ 'books.author' | translate }}</label>
            <div class="ds-input-group">
              <span class="ds-input-group__icon" aria-hidden="true"><i class="fas fa-pen-fancy"></i></span>
              <input type="text" class="ds-input" id="bookAuthor"
                     [(ngModel)]="book.bookAuthor" name="bookAuthor"
                     placeholder="Antoine de Saint-Exupéry">
            </div>
          </div>

          <div class="ds-field">
            <label class="ds-label ds-label--required" for="bookGenre">{{ 'books.genre' | translate }}</label>
            <div class="ds-input-group">
              <span class="ds-input-group__icon" aria-hidden="true"><i class="fas fa-tag"></i></span>
              <input type="text" class="ds-input" id="bookGenre"
                     [(ngModel)]="book.bookGenre" name="bookGenre"
                     placeholder="Roman">
            </div>
          </div>

          <div class="ds-field">
            <label class="ds-label ds-label--required" for="noOfCopies">{{ 'books.copies' | translate }}</label>
            <div class="ds-input-group">
              <span class="ds-input-group__icon" aria-hidden="true"><i class="fas fa-layer-group"></i></span>
              <input type="number" class="ds-input" id="noOfCopies"
                     [(ngModel)]="book.noOfCopies" name="noOfCopies"
                     placeholder="5" min="0">
            </div>
          </div>

          <div class="create-book__actions">
            <button type="button" class="ds-btn ds-btn--secondary" (click)="goToBooksList()">
              {{ 'common.cancel' | translate }}
            </button>
            <button type="submit" class="ds-btn ds-btn--primary" [disabled]="loading || !isFormValid">
              <span *ngIf="loading" class="ds-spinner" aria-hidden="true"></span>
              <i *ngIf="!loading" class="fas fa-floppy-disk" aria-hidden="true"></i>
              {{ (loading ? 'common.saving' : 'common.save') | translate }}
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Illustration -->
    <div class="ds-split__art anim-fade">
      <app-illustration name="shelf"></app-illustration>
    </div>

  </div>
</div>
