<div class="page-wrapper">
  <div class="row justify-content-center">
    <div class="col-12 col-sm-10 col-md-8 col-lg-6">

      <!-- Header -->
      <div class="page-header text-center">
        <h2 class="page-title justify-content-center">
          <span class="page-title-icon"><i class="fas fa-plus-circle"></i></span>
          Ajouter un Livre
        </h2>
        <p class="page-subtitle">Enrichissez le catalogue de la bibliothèque</p>
      </div>

      <!-- Toast erreur -->
      <div *ngIf="errorMessage" class="toast-message toast-error">
        <div class="d-flex align-items-center">
          <span class="toast-icon"><i class="fas fa-exclamation-circle"></i></span>
          <span>{{ errorMessage }}</span>
        </div>
        <button class="btn-close" (click)="errorMessage = ''" aria-label="Fermer"></button>
      </div>

      <!-- Toast succès -->
      <div *ngIf="successMessage" class="toast-message toast-success">
        <div class="d-flex align-items-center">
          <span class="toast-icon"><i class="fas fa-check-circle"></i></span>
          <span>{{ successMessage }}</span>
        </div>
        <button class="btn-close" (click)="successMessage = ''" aria-label="Fermer"></button>
      </div>

      <!-- Formulaire -->
      <div class="form-card">
        <form (ngSubmit)="onSubmit()" autocomplete="off">

          <!-- Nom du livre -->
          <div class="mb-3">
            <label for="bookName" class="form-label"><i class="fas fa-book me-1"></i> Nom du livre <span class="required">*</span></label>
            <input type="text" class="form-control" id="bookName"
              [(ngModel)]="book.bookName" name="bookName"
              placeholder="Ex: Le Petit Prince">
          </div>

          <!-- Auteur -->
          <div class="mb-3">
            <label for="bookAuthor" class="form-label"><i class="fas fa-pen-fancy me-1"></i> Auteur <span class="required">*</span></label>
            <input type="text" class="form-control" id="bookAuthor"
              [(ngModel)]="book.bookAuthor" name="bookAuthor"
              placeholder="Ex: Antoine de Saint-Exupéry">
          </div>

          <!-- Genre -->
          <div class="mb-3">
            <label for="bookGenre" class="form-label"><i class="fas fa-tag me-1"></i> Genre <span class="required">*</span></label>
            <input type="text" class="form-control" id="bookGenre"
              [(ngModel)]="book.bookGenre" name="bookGenre"
              placeholder="Ex: Roman">
          </div>

          <!-- Copies -->
          <div class="mb-4">
            <label for="noOfCopies" class="form-label"><i class="fas fa-layer-group me-1"></i> Nombre de copies <span class="required">*</span></label>
            <input type="number" class="form-control" id="noOfCopies"
              [(ngModel)]="book.noOfCopies" name="noOfCopies"
              placeholder="Ex: 5" min="1">
          </div>

          <!-- Boutons -->
          <div class="form-actions">
            <button type="button" class="btn-cancel" (click)="goToBooksList()">
              <i class="fas fa-times"></i> Annuler
            </button>
            <button class="btn-submit" type="submit" [disabled]="loading || !isFormValid">
              <i *ngIf="!loading" class="fas fa-save"></i>
              <span *ngIf="loading" class="spinner-small"></span>
              {{ loading ? 'Création...' : 'Enregistrer' }}
            </button>
          </div>
        </form>
      </div>

    </div>
  </div>
</div>
