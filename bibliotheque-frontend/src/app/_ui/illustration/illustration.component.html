<!-- Lecture : une personne stylisée assise avec un livre ouvert. -->
<svg *ngIf="name === 'reading'" class="ill" viewBox="0 0 420 340" fill="none"
     xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient [attr.id]="uid + '-a'" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="var(--brand-400)"/>
      <stop offset="100%" stop-color="var(--brand-600)"/>
    </linearGradient>
    <linearGradient [attr.id]="uid + '-b'" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="var(--brand-300)"/>
      <stop offset="100%" stop-color="var(--brand-700)"/>
    </linearGradient>
  </defs>

  <!-- Halo -->
  <circle cx="210" cy="160" r="128" [attr.fill]="'url(#' + uid + '-a)'" opacity="0.12"/>
  <circle cx="210" cy="160" r="92" [attr.fill]="'url(#' + uid + '-b)'" opacity="0.10"/>

  <!-- Livres empilés en arrière-plan -->
  <g class="ill-float-slow">
    <rect x="60" y="212" width="86" height="15" rx="4" [attr.fill]="'url(#' + uid + '-a)'" opacity="0.85"/>
    <rect x="66" y="196" width="74" height="15" rx="4" fill="var(--brand-400)" opacity="0.7"/>
    <rect x="72" y="180" width="62" height="15" rx="4" fill="var(--brand-300)" opacity="0.8"/>
  </g>

  <!-- Personnage -->
  <g>
    <!-- Corps -->
    <path d="M198 246c-30 0-54-17-54-44 0-24 18-42 44-42h26c26 0 44 18 44 42 0 27-24 44-54 44h-6z"
          [attr.fill]="'url(#' + uid + '-a)'"/>
    <!-- Tête -->
    <circle cx="210" cy="128" r="30" fill="var(--brand-200)"/>
    <path d="M180 126c0-19 13-32 30-32s30 13 30 32c0-6-12-11-30-11s-30 5-30 11z" fill="var(--brand-700)"/>
    <!-- Bras -->
    <rect x="152" y="196" width="52" height="16" rx="8" fill="var(--brand-300)"/>
    <rect x="216" y="196" width="52" height="16" rx="8" fill="var(--brand-300)"/>
  </g>

  <!-- Livre ouvert au premier plan -->
  <g class="ill-float">
    <path d="M140 200h68v56h-68z" fill="var(--surface)" stroke="var(--brand-600)" stroke-width="3"/>
    <path d="M212 200h68v56h-68z" fill="var(--surface)" stroke="var(--brand-600)" stroke-width="3"/>
    <path d="M208 196c0-4 4-6 8-6s8 2 8 6v64c0-4-4-6-8-6s-8 2-8 6z" [attr.fill]="'url(#' + uid + '-a)'"/>
    <path d="M152 214h44M152 226h44M152 238h30" stroke="var(--brand-300)" stroke-width="3" stroke-linecap="round"/>
    <path d="M224 214h44M224 226h44M224 238h30" stroke="var(--brand-300)" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Sol -->
  <ellipse cx="210" cy="286" rx="130" ry="12" fill="var(--brand-500)" opacity="0.10"/>
</svg>

<!-- Rayonnage : une étagère remplie de tranches de livres. -->

     xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient [attr.id]="uid + '-a'" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="var(--brand-400)"/>
      <stop offset="100%" stop-color="var(--brand-600)"/>
    </linearGradient>
  </defs>

  <circle cx="210" cy="164" r="132" [attr.fill]="'url(#' + uid + '-a)'" opacity="0.10"/>

  <!-- Étagère haute -->
  <g class="ill-float-slow">
    <rect x="96" y="86" width="18" height="72" rx="3" fill="var(--brand-600)"/>
    <rect x="120" y="98" width="16" height="60" rx="3" fill="var(--brand-400)"/>
    <rect x="142" y="80" width="20" height="78" rx="3" fill="var(--brand-400)"/>
    <rect x="168" y="94" width="14" height="64" rx="3" fill="var(--brand-700)"/>
    <rect x="188" y="86" width="18" height="72" rx="3" fill="var(--brand-700)"/>
    <rect x="212" y="102" width="16" height="56" rx="3" fill="var(--brand-300)"/>
    <rect x="234" y="82" width="20" height="76" rx="3" fill="var(--brand-500)"/>
    <rect x="260" y="96" width="14" height="62" rx="3" fill="var(--brand-300)"/>
    <rect x="280" y="88" width="18" height="70" rx="3" fill="var(--brand-600)"/>
  </g>
  <rect x="84" y="158" width="228" height="12" rx="4" fill="var(--brand-800)"/>

  <!-- Étagère basse -->
  <g class="ill-float">
    <rect x="104" y="196" width="16" height="64" rx="3" fill="var(--brand-400)"/>
    <rect x="126" y="184" width="20" height="76" rx="3" fill="var(--brand-500)"/>
    <rect x="152" y="200" width="14" height="60" rx="3" fill="var(--brand-300)"/>
    <rect x="172" y="188" width="18" height="72" rx="3" fill="var(--brand-700)"/>
    <rect x="196" y="198" width="16" height="62" rx="3" fill="var(--brand-700)"/>
    <rect x="218" y="186" width="20" height="74" rx="3" fill="var(--brand-400)"/>
    <rect x="244" y="202" width="14" height="58" rx="3" fill="var(--brand-600)"/>
    <rect x="264" y="190" width="18" height="70" rx="3" fill="var(--brand-300)"/>
  </g>
  <rect x="84" y="260" width="228" height="12" rx="4" fill="var(--brand-800)"/>

  <ellipse cx="210" cy="292" rx="120" ry="10" fill="var(--brand-500)" opacity="0.10"/>
</svg>

<!-- Réservation : un livre marqué d'un signet et d'une horloge. -->
<svg *ngIf="name === 'reserve'" class="ill" viewBox="0 0 420 340" fill="none"
     xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient [attr.id]="uid + '-a'" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="var(--brand-400)"/>
      <stop offset="100%" stop-color="var(--brand-600)"/>
    </linearGradient>
  </defs>

  <circle cx="210" cy="160" r="124" [attr.fill]="'url(#' + uid + '-a)'" opacity="0.12"/>

  <!-- Livre fermé, vu de trois quarts -->
  <g class="ill-float">
    <rect x="132" y="92" width="150" height="184" rx="10" [attr.fill]="'url(#' + uid + '-a)'"/>
    <rect x="146" y="92" width="136" height="184" rx="10" fill="var(--surface)"
          stroke="var(--brand-500)" stroke-width="3"/>
    <path d="M170 124h90M170 146h90M170 168h62" stroke="var(--brand-300)"
          stroke-width="6" stroke-linecap="round"/>

    <!-- Signet -->
    <path d="M236 92h30v74l-15-14-15 14z" fill="var(--brand-400)"/>
  </g>

  <!-- Horloge : la réservation expire -->
  <g class="ill-float-slow">
    <circle cx="286" cy="230" r="44" fill="var(--surface)" stroke="var(--brand-600)" stroke-width="4"/>
    <path d="M286 206v26l18 12" stroke="var(--brand-600)" stroke-width="5"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <ellipse cx="210" cy="296" rx="118" ry="11" fill="var(--brand-500)" opacity="0.10"/>
</svg>

<!-- Vide : un rayonnage dégarni. -->
<svg *ngIf="name === 'empty'" class="ill" viewBox="0 0 420 300" fill="none"
     xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient [attr.id]="uid + '-a'" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="var(--brand-300)"/>
      <stop offset="100%" stop-color="var(--brand-500)"/>
    </linearGradient>
  </defs>

  <circle cx="210" cy="150" r="112" [attr.fill]="'url(#' + uid + '-a)'" opacity="0.10"/>

  <!-- Étagère presque vide -->
  <rect x="104" y="176" width="212" height="11" rx="4" fill="var(--border-strong)"/>
  <rect x="112" y="118" width="18" height="58" rx="3" fill="var(--brand-400)" opacity="0.55"/>
  <rect x="136" y="132" width="14" height="44" rx="3" fill="var(--brand-400)" opacity="0.45"/>

  <!-- Emplacements libres -->
  <rect x="170" y="122" width="18" height="54" rx="3" fill="none"
        stroke="var(--border-strong)" stroke-width="2.5" stroke-dasharray="6 6"/>
  <rect x="196" y="122" width="18" height="54" rx="3" fill="none"
        stroke="var(--border-strong)" stroke-width="2.5" stroke-dasharray="6 6"/>
  <rect x="222" y="122" width="18" height="54" rx="3" fill="none"
        stroke="var(--border-strong)" stroke-width="2.5" stroke-dasharray="6 6"/>

  <ellipse cx="210" cy="212" rx="104" ry="9" fill="var(--brand-500)" opacity="0.08"/>
</svg>

<!-- Recherche sans résultat : une loupe au-dessus d'un rayon. -->
<svg *ngIf="name === 'search'" class="ill" viewBox="0 0 420 300" fill="none"
     xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient [attr.id]="uid + '-a'" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="var(--brand-400)"/>
      <stop offset="100%" stop-color="var(--brand-600)"/>
    </linearGradient>
  </defs>

  <circle cx="210" cy="148" r="112" [attr.fill]="'url(#' + uid + '-a)'" opacity="0.10"/>

  <rect x="118" y="182" width="184" height="11" rx="4" fill="var(--border-strong)"/>
  <rect x="128" y="142" width="16" height="40" rx="3" fill="var(--brand-300)" opacity="0.6"/>
  <rect x="150" y="150" width="13" height="32" rx="3" fill="var(--brand-400)" opacity="0.5"/>
  <rect x="262" y="146" width="16" height="36" rx="3" fill="var(--brand-400)" opacity="0.6"/>

  <g class="ill-float">
    <circle cx="206" cy="126" r="46" fill="var(--surface)" [attr.stroke]="'url(#' + uid + '-a)'" stroke-width="8"/>
    <circle cx="206" cy="126" r="30" fill="var(--brand-400)" opacity="0.12"/>
    <path d="M240 160l30 30" [attr.stroke]="'url(#' + uid + '-a)'" stroke-width="12" stroke-linecap="round"/>
  </g>

  <ellipse cx="210" cy="216" rx="98" ry="9" fill="var(--brand-500)" opacity="0.08"/>
</svg>

<!-- Accès refusé : un cadenas fermé. -->
<svg *ngIf="name === 'locked'" class="ill" viewBox="0 0 420 320" fill="none"
     xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient [attr.id]="uid + '-a'" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
  </defs>

  <circle cx="210" cy="156" r="118" [attr.fill]="'url(#' + uid + '-a)'" opacity="0.12"/>

  <g class="ill-float">
    <!-- Anse -->
    <path d="M168 140v-26a42 42 0 0 1 84 0v26" [attr.stroke]="'url(#' + uid + '-a)'" stroke-width="18"
          stroke-linecap="round" fill="none"/>
    <!-- Corps -->
    <rect x="140" y="140" width="140" height="112" rx="18" [attr.fill]="'url(#' + uid + '-a)'"/>
    <circle cx="210" cy="188" r="16" fill="var(--surface)"/>
    <rect x="203" y="196" width="14" height="30" rx="7" fill="var(--surface)"/>
  </g>

  <ellipse cx="210" cy="276" rx="106" ry="10" fill="#dc2626" opacity="0.12"/>
</svg>

<!-- Adhérent : une carte de membre. -->
<svg *ngIf="name === 'member'" class="ill" viewBox="0 0 420 320" fill="none"
     xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient [attr.id]="uid + '-a'" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="var(--brand-400)"/>
      <stop offset="100%" stop-color="var(--brand-600)"/>
    </linearGradient>
  </defs>

  <circle cx="210" cy="158" r="120" [attr.fill]="'url(#' + uid + '-a)'" opacity="0.11"/>

  <g class="ill-float">
    <rect x="104" y="104" width="212" height="132" rx="16" fill="var(--surface)"
          stroke="var(--brand-500)" stroke-width="3"/>
    <rect x="104" y="104" width="212" height="34" rx="16" [attr.fill]="'url(#' + uid + '-a)'"/>
    <rect x="104" y="122" width="212" height="16" [attr.fill]="'url(#' + uid + '-a)'"/>

    <!-- Portrait -->
    <circle cx="154" cy="182" r="26" fill="var(--brand-200)"/>
    <path d="M130 220a24 24 0 0 1 48 0z" fill="var(--brand-400)"/>

    <!-- Lignes d'information -->
    <rect x="196" y="164" width="94" height="10" rx="5" fill="var(--brand-300)"/>
    <rect x="196" y="184" width="74" height="10" rx="5" fill="var(--border-strong)"/>
    <rect x="196" y="204" width="58" height="10" rx="5" fill="var(--border-strong)"/>
  </g>

  <ellipse cx="210" cy="262" rx="112" ry="10" fill="var(--brand-500)" opacity="0.10"/>
</svg>
