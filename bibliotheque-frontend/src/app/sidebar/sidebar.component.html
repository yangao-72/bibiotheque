<aside class="sidebar" [class.collapsed]="false">
  <!-- Logo -->
  <div class="sidebar-brand">
    <span class="brand-icon">📖</span>
    <div class="brand-text">
      <h1>BiblioGest</h1>
      <p>Gestion de bibliothèque</p>
    </div>
  </div>

  <!-- Navigation -->
  <nav class="sidebar-nav">
    <ul>
      <!-- Admin Menu -->
      <li *ngIf="isAdmin()">
        <a routerLink="/books" routerLinkActive="active" class="nav-item">
          <span class="nav-icon">📚</span>
          <span class="nav-label">Livres</span>
        </a>
      </li>
      <li *ngIf="isAdmin()">
        <a routerLink="/users" routerLinkActive="active" class="nav-item">
          <span class="nav-icon">👥</span>
          <span class="nav-label">Adhérents</span>
        </a>
      </li>
      <li *ngIf="isAdmin()">
        <a routerLink="/reservations" routerLinkActive="active" class="nav-item">
          <span class="nav-icon">🗓️</span>
          <span class="nav-label">Réservations</span>
        </a>
      </li>
      <li *ngIf="isAdmin()">
        <a routerLink="/create-book" routerLinkActive="active" class="nav-item">
          <span class="nav-icon">➕</span>
          <span class="nav-label">Ajouter un livre</span>
        </a>
      </li>
      <li *ngIf="isAdmin()">
        <a routerLink="/register-user" routerLinkActive="active" class="nav-item">
          <span class="nav-icon">📝</span>
          <span class="nav-label">Inscrire un adhérent</span>
        </a>
      </li>

      <!-- User Menu -->
      <li *ngIf="isUser()">
        <a routerLink="/borrow-book" routerLinkActive="active" class="nav-item">
          <span class="nav-icon">📖</span>
          <span class="nav-label">Emprunts</span>
        </a>
      </li>
      <li *ngIf="isUser()">
        <a routerLink="/return-book" routerLinkActive="active" class="nav-item">
          <span class="nav-icon">📤</span>
          <span class="nav-label">Retours</span>
        </a>
      </li>
      <li *ngIf="isUser()">
        <a routerLink="/reservations" routerLinkActive="active" class="nav-item">
          <span class="nav-icon">🗓️</span>
          <span class="nav-label">Réservations</span>
        </a>
      </li>
    </ul>
  </nav>

  <!-- User Profile -->
  <div class="sidebar-footer" *ngIf="isLoggedIn()">
    <div class="user-profile">
      <div class="user-avatar">{{ name?.charAt(0) || '?' }}</div>
      <div class="user-info">
        <span class="user-name">{{ name }}</span>
        <span class="user-role">{{ role }}</span>
      </div>
      <button class="btn-logout" (click)="logout()" title="Déconnexion">
        🚪
      </button>
    </div>
  </div>
</aside>
