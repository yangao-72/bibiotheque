<header class="topbar">
  <!-- Hamburger -->
  <button class="btn-hamburger" (click)="onToggleSidebar()"
          [attr.aria-label]="'nav.openMenu' | translate">
    <span></span>
    <span></span>
    <span></span>
  </button>

  <!-- Search -->
  <div class="search-bar">
    <span class="search-icon"><i class="fas fa-search"></i></span>
    <input type="text"
           [attr.placeholder]="'topbar.searchPlaceholder' | translate"
           [attr.aria-label]="'common.search' | translate"
           [(ngModel)]="searchQuery"
           class="search-input">
  </div>

  <!-- Right side -->
  <div class="topbar-actions">
    <!-- Sélecteur de langue -->
    <app-language-switcher></app-language-switcher>

    <!-- Dark Mode Toggle -->
    <button class="btn-theme"
            (click)="toggleDarkMode()"
            [title]="(isDarkMode ? 'topbar.lightMode' : 'topbar.darkMode') | translate"
            [attr.aria-label]="(isDarkMode ? 'topbar.lightMode' : 'topbar.darkMode') | translate">
      <i class="fas" [ngClass]="isDarkMode ? 'fa-sun' : 'fa-moon'" aria-hidden="true"></i>
    </button>

    <!-- Notifications -->
    <div class="notification-wrapper">
      <button class="btn-notification" (click)="toggleNotifications($event)"
              [attr.aria-label]="'topbar.notifications' | translate"
              [attr.aria-expanded]="showNotifications">
        <i class="fas fa-bell" aria-hidden="true"></i>
        <span class="notification-badge">3</span>
      </button>

      <!-- Dropdown -->
      <div class="notification-dropdown" *ngIf="showNotifications">
        <div class="notification-header">
          <h4>{{ 'topbar.notifications' | translate }}</h4>
          <a href="javascript:void(0)">{{ 'common.seeAll' | translate }} <i class="fas fa-arrow-right" aria-hidden="true"></i></a>
        </div>
        <ul class="notification-list">
          <li *ngFor="let n of notifications">
            <span class="notif-icon" [style.background]="n.iconColor + '15'" [style.color]="n.iconColor">
              <i [class]="n.iconClass"></i>
            </span>
            <div class="notif-content">
              <strong>{{ n.title }}</strong>
              <p>{{ n.subtitle }}</p>
            </div>
            <span class="notif-time">{{ n.time }}</span>
          </li>
        </ul>
      </div>
    </div>
  </div>
</header>
