<div class="login bg-hero">

  <!-- La barre du haut est absente de cet écran : sans ce sélecteur, un
       visiteur non francophone n'aurait aucun moyen de changer de langue
       avant de s'être connecté. -->
  <div class="login-lang">
    <app-language-switcher></app-language-switcher>
  </div>

  <div class="login-card anim-pop">

    <!-- Volet de marque -->
    <aside class="login-brandside">
      <div class="login-brandside__top">
        <span class="login-logo" aria-hidden="true"><i class="fas fa-book-open"></i></span>
        <span class="login-logo__name">{{ 'app.name' | translate }}</span>
      </div>

      <div class="login-brandside__art">
        <app-illustration name="reading"></app-illustration>
      </div>

      <div class="login-brandside__bottom">
        <h2 class="login-brandside__title">{{ 'auth.welcome' | translate }}</h2>
        <p class="login-brandside__text">{{ 'home.heroText' | translate }}</p>
        <ul class="login-dots" aria-hidden="true">
          <li class="is-active"></li><li></li><li></li>
        </ul>
      </div>
    </aside>

    <!-- Volet formulaire -->
    <div class="login-formside">
      <h1 class="login-title">{{ 'auth.signIn' | translate }}</h1>
      <p class="login-sub">{{ 'auth.signInSubtitle' | translate }}</p>

      <div *ngIf="errorMessage" class="login-alert anim-rise-sm" role="alert">
        <i class="fas fa-circle-exclamation" aria-hidden="true"></i>
        <span>{{ errorMessage | translate }}</span>
        <button type="button" class="login-alert__close" (click)="errorMessage = ''"
                [attr.aria-label]="'common.close' | translate">
          <i class="fas fa-xmark" aria-hidden="true"></i>
        </button>
      </div>

      <form autocomplete="off" #loginForm="ngForm" (ngSubmit)="login(loginForm)" novalidate>
        <div class="login-field">
          <label class="sr-only" for="login-username">{{ 'auth.username' | translate }}</label>
          <input id="login-username"
                 type="text"
                 name="username"
                 ngModel
                 class="login-input"
                 autocomplete="username"
                 [attr.placeholder]="'auth.username' | translate">
          <i class="fas fa-user login-field__icon" aria-hidden="true"></i>
        </div>

        <div class="login-field">
          <label class="sr-only" for="login-password">{{ 'auth.password' | translate }}</label>
          <input id="login-password"
                 type="password"
                 name="password"
                 ngModel
                 class="login-input"
                 autocomplete="current-password"
                 [attr.placeholder]="'auth.password' | translate">
          <i class="fas fa-lock login-field__icon" aria-hidden="true"></i>
        </div>

        <button type="submit" class="login-submit" [disabled]="loading">
          <span *ngIf="loading" class="ds-spinner" aria-hidden="true"></span>
          <i *ngIf="!loading" class="fas fa-right-to-bracket" aria-hidden="true"></i>
          {{ (loading ? 'auth.signingIn' : 'auth.signIn') | translate }}
        </button>
      </form>

      <p class="login-hint">
        <i class="fas fa-circle-info" aria-hidden="true"></i>
        {{ 'auth.credentialsHint' | translate }}
      </p>
    </div>

  </div>
</div>
