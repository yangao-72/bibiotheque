<div class="login-container">
  <div class="login-card">
    <!-- Logo -->
    <div class="login-logo">
      <span class="logo-icon">📖</span>
      <h1>BiblioGest</h1>
      <p class="login-subtitle">Gestion de bibliothèque</p>
    </div>

    <!-- Toast erreur -->
    <div *ngIf="errorMessage" class="toast-error">
      <span>⚠️</span> {{ errorMessage }}
      <button class="toast-close" (click)="errorMessage = ''">✕</button>
    </div>

    <!-- Formulaire -->
    <form autocomplete="off" #loginForm="ngForm" (ngSubmit)="login(loginForm)">
      <div class="form-group">
        <label class="form-label">Nom d'utilisateur</label>
        <input type="text" name="username" ngModel class="form-input"
               placeholder="Entrez votre identifiant">
      </div>

      <div class="form-group">
        <label class="form-label">Mot de passe</label>
        <input type="password" name="password" ngModel class="form-input"
               placeholder="Entrez votre mot de passe">
      </div>

      <button type="submit" class="btn-login" [disabled]="loading">
        <span *ngIf="loading" class="spinner-small"></span>
        {{ loading ? 'Connexion...' : 'Se connecter' }}
      </button>
    </form>

    <p class="login-hint">Identifiants fournis par l'administrateur.</p>
  </div>
</div>
