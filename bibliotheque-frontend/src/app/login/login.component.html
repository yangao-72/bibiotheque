<div class="login-container">
  <div class="login-card">
    <!-- Logo -->
    <div class="login-logo">
      <div class="logo-icon"><i class="fas fa-book-open"></i></div>
      <h1>BiblioGest</h1>
      <p class="login-subtitle">Gestion de bibliothèque</p>
    </div>

    <!-- Toast erreur -->
    <div *ngIf="errorMessage" class="toast-error">
      <i class="fas fa-exclamation-circle"></i> {{ errorMessage }}
      <button class="toast-close" (click)="errorMessage = ''"><i class="fas fa-times"></i></button>
    </div>

    <!-- Formulaire -->
    <form autocomplete="off" #loginForm="ngForm" (ngSubmit)="login(loginForm)">
      <div class="form-group">
        <label class="form-label"><i class="fas fa-user me-1"></i> Nom d'utilisateur</label>
        <input type="text" name="username" ngModel class="form-input"
               placeholder="Entrez votre identifiant">
      </div>

      <div class="form-group">
        <label class="form-label"><i class="fas fa-lock me-1"></i> Mot de passe</label>
        <input type="password" name="password" ngModel class="form-input"
               placeholder="Entrez votre mot de passe">
      </div>

      <button type="submit" class="btn-login" [disabled]="loading">
        <span *ngIf="loading" class="spinner-small"></span>
        <i *ngIf="!loading" class="fas fa-sign-in-alt me-2"></i>
        {{ loading ? 'Connexion...' : 'Se connecter' }}
      </button>
    </form>

    <p class="login-hint"><i class="fas fa-info-circle me-1"></i> Identifiants fournis par l'administrateur.</p>
  </div>
</div>
