<div class="registration bg-grid">
  <div class="registration__shell ds-split">

    <!-- Formulaire -->
    <div class="ds-card anim-rise">
      <div class="ds-card__body">
        <header class="ds-page-header">
          <div>
            <h1 class="ds-page-header__title">
              <span class="ds-page-header__icon" aria-hidden="true"><i class="fas fa-user-plus"></i></span>
              {{ 'members.addTitle' | translate }}
            </h1>
            <p class="ds-page-header__subtitle">{{ 'members.addSubtitle' | translate }}</p>
          </div>
        </header>

        <!-- Messages : annoncés aux lecteurs d'écran -->
        <div *ngIf="successMessage" class="reg-alert reg-alert--success anim-rise-sm" role="status">
          <i class="fas fa-circle-check" aria-hidden="true"></i>
          <span>{{ successMessage | translate }}</span>
        </div>

        <div *ngIf="errorMessage" class="reg-alert reg-alert--error anim-rise-sm" role="alert">
          <i class="fas fa-circle-exclamation" aria-hidden="true"></i>
          <span>{{ errorMessage | translate }}</span>
          <button type="button" class="reg-alert__close" (click)="errorMessage = ''"
                  [attr.aria-label]="'common.close' | translate">
            <i class="fas fa-xmark" aria-hidden="true"></i>
          </button>
        </div>

        <form (ngSubmit)="onSubmit()" autocomplete="off" novalidate>

          <div class="ds-field">
            <label class="ds-label ds-label--required" for="reg-name">{{ 'members.name' | translate }}</label>
            <div class="ds-input-group">
              <span class="ds-input-group__icon" aria-hidden="true"><i class="fas fa-user"></i></span>
              <input id="reg-name" type="text" class="ds-input"
                     [(ngModel)]="user.name" name="name" placeholder="Jean Dupont">
            </div>
          </div>

          <div class="ds-field">
            <label class="ds-label ds-label--required" for="reg-username">{{ 'members.username' | translate }}</label>
            <div class="ds-input-group">
              <span class="ds-input-group__icon" aria-hidden="true"><i class="fas fa-at"></i></span>
              <input id="reg-username" type="text" class="ds-input"
                     [(ngModel)]="user.username" name="username" placeholder="jdupont">
            </div>
          </div>

          <div class="ds-field">
            <label class="ds-label ds-label--required" for="reg-password">{{ 'members.password' | translate }}</label>
            <div class="ds-input-group">
              <span class="ds-input-group__icon" aria-hidden="true"><i class="fas fa-lock"></i></span>
              <input id="reg-password" type="password" class="ds-input"
                     [(ngModel)]="user.password" name="password" placeholder="••••••••"
                     autocomplete="new-password">
            </div>
          </div>

          <div class="ds-field">
            <label class="ds-label" for="reg-role">{{ 'members.role' | translate }}</label>
            <select id="reg-role" class="ds-select" [(ngModel)]="user.role[0].roleName" name="role">
              <option value="Admin">{{ 'members.profileAdmin' | translate }}</option>
              <option value="User">{{ 'members.profileMember' | translate }}</option>
            </select>
            <span class="ds-hint">{{ 'members.profileHint' | translate }}</span>
          </div>

          <div class="registration__actions">
            <button type="button" class="ds-btn ds-btn--secondary" (click)="goToUsersList()">
              {{ 'common.cancel' | translate }}
            </button>
            <button type="submit" class="ds-btn ds-btn--primary" [disabled]="saving">
              <span *ngIf="saving" class="ds-spinner" aria-hidden="true"></span>
              <i *ngIf="!saving" class="fas fa-check" aria-hidden="true"></i>
              {{ (saving ? 'common.saving' : 'common.submit') | translate }}
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Illustration -->
    <div class="ds-split__art anim-fade">
      <app-illustration name="member"></app-illustration>
    </div>

  </div>
</div>
