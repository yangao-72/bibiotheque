<!-- Liste vide -->
<div *ngIf="reservations.length === 0" class="alert alert-info text-center">
  Aucune réservation trouvée.
</div>

<!-- Tableau -->
<table *ngIf="reservations.length > 0" class="table table-success table-striped">
  <thead>
    <tr>
      <th>Livre</th>
      <th>Adhérent</th>
      <th>Statut</th>
      <th>Date de réservation</th>
      <th>Date d'expiration</th>
      <th>Action</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let r of reservations">
      <td>{{ r.livreNom }}</td>
      <td>{{ r.adherentNom }}</td>
      <td>
        <span [class]="getStatutClass(r.statut)">{{ r.statut }}</span>
      </td>
      <td>{{ r.dateReservation }}</td>
      <td>{{ r.dateExpiration }}</td>
      <td>
        <button
          *ngIf="canCancel(r.statut)"
          class="btn btn-danger btn-sm"
          (click)="confirmAnnuler(r)">
          Annuler
        </button>
      </td>
    </tr>
  </tbody>
</table>
