<!-- Première tabulation de la page : permet de sauter la navigation. -->
<a class="skip-link" href="#main-content">{{ 'app.skipToContent' | translate }}</a>

<div class="app-layout" [class.sidebar-open]="sidebarOpen">
  <!-- Sidebar -->
  <app-sidebar
    [isOpen]="sidebarOpen"
    (toggleSidebar)="toggleSidebar()">
  </app-sidebar>

  <!-- Main Area -->
  <div class="main-area">
    <!-- Topbar -->
    <app-topbar (toggleSidebar)="toggleSidebar()"></app-topbar>

    <!-- Content -->
    <main class="main-content" id="main-content" tabindex="-1">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>

<!-- Overlay for mobile -->
<div class="sidebar-overlay"
     *ngIf="sidebarOpen"
     (click)="toggleSidebar()">
</div>

<!-- Couches globales : montées une seule fois, elles flottent au-dessus de tout -->
<app-toast-container></app-toast-container>
<app-confirm-dialog></app-confirm-dialog>
