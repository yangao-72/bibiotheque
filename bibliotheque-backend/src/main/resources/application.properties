server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5433/bibliotheque
spring.datasource.username=bibliotheque
spring.datasource.password=bibliotheque

spring.jpa.show-sql = true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
hibernate.format_sql=true

# Inclure les messages d'erreur dans les réponses HTTP
server.error.include-message=always

# Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Spring Boot 2.6+ refuse les références circulaires par défaut ; le code
# (conçu pour Spring Boot 2.4) en utilise une.
spring.main.allow-circular-references=true